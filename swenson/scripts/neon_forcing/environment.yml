# Conda environment for the NCAR-NEON CLM forcing pipeline (flow.api.clm.R).
# Create with: CONDA_CHANNEL_PRIORITY=strict conda env create -f environment.yml
# Update with: CONDA_CHANNEL_PRIORITY=strict conda env update -f environment.yml --prune
#
# channel_priority=strict cannot live in this file; build_env.sh sets it via
#   CONDA_CHANNEL_PRIORITY so bioconda never shadows a conda-forge build.
# EXCLUDES the 10 source-only R packages (REddyProc, solartime, bigleaf,
#   eddy4R.base/qaqc, DataCombine, EMD, robfilter, metScanR, prism) and r-ffbase
#   (no r44 conda build) -- install_source_pkgs.R builds those from source.
name: neon-forcing
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # === R interpreter (ABI anchor) -- pin the minor series ===
  # r-base 4.4 pairs with bioconductor-rhdf5 2.50.0 (r44). conda-forge ships r-base
  # to 4.6.1 but rhdf5 tops at r45 (no r46), so unpinned would drift and break rhdf5.
  - r-base=4.4.*

  # === conda-forge toolchain (NOT lmod gcc) -- ABI-matched to conda's r-base ===
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - make
  - pkg-config
  - git

  # === source-build driver ===
  - r-remotes                # install_github / install_version / install_local

  # === packReq: runtime-required, conda-satisfiable ===
  - bioconductor-rhdf5       # bioconda; r44 build 2.50.0
  - r-ncdf4
  - r-reshape2
  - r-ggplot2
  - r-gridextra
  - r-knitr
  - r-naniar
  - r-rfast
  - r-neonutilities>=3.0     # v4 used 2.4.0; conda min is 3.0.0 -- see README/plan risks
  - r-googlecloudstorager
  - r-dplyr
  - r-tidyr

  # === compiled/heavy/niche bases the source pkgs link/import (pre-provisioned so
  #     remotes only builds pure-R/light sources, never a GDAL/C++ dep) ===
  - r-ff                     # eddy4R.base; CRAN ffbase links against it
  - r-signal                 # eddy4R.base
  - r-zoo                    # eddy4R.base
  - r-deming                 # eddy4R.base
  - r-downloader             # eddy4R.base
  - r-polynom                # eddy4R.base
  - r-biocmanager            # eddy4R.base
  - r-robustbase             # NEON.gf (only hard dep)
  - r-raster                 # prism (GDAL/GEOS/PROJ-linked)
  - r-terra                  # prism -> raster
  - r-sp                     # prism -> raster
  - r-rcurl                  # metScanR
  - r-geosphere              # metScanR
  - r-leaflet                # metScanR
  - r-matlab                 # metScanR
  - r-rmisc                  # eddy4R.qaqc
  - r-rcpproll               # eddy4R.qaqc
  - r-plyr                   # eddy4R.qaqc / metScanR
